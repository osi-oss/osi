basePath: /api
definitions:
  github_com_osi-oss_osi_internal_dto.CreateDepartmentRequest:
    description: Данные для создания нового отдела в локации
    properties:
      description:
        description: |-
          Описание отдела
          Example: Отдел занимается продажами и работой с клиентами
        example: Отдел занимается продажами и работой с клиентами
        type: string
      name:
        description: |-
          Название отдела (обязательное)
          Example: Отдел продаж
        example: Отдел продаж
        type: string
      parent_id:
        description: |-
          ID родительского отдела (для создания иерархии)
          Example: 1
        example: 1
        type: integer
    required:
    - name
    type: object
  github_com_osi-oss_osi_internal_dto.CreateLocationRequest:
    description: Данные для создания новой локации (офиса, филиала, склада и т.д.)
    properties:
      address:
        description: |-
          Физический адрес локации
          Example: г. Москва, ул. Ленина, д. 10
        example: г. Москва, ул. Ленина, д. 10
        type: string
      is_verified:
        description: |-
          Подтверждена ли локация
          Example: false
        example: false
        type: boolean
      name:
        description: |-
          Название локации (обязательное)
          Example: Главный офис
        example: Главный офис
        type: string
      source:
        description: |-
          Источник данных: manual, egrul, api
          Example: manual
        enum:
        - manual
        - egrul
        - api
        example: manual
        type: string
    required:
    - name
    - source
    type: object
  github_com_osi-oss_osi_internal_dto.CreateOrganizationRequest:
    description: Данные для создания новой организации
    properties:
      inn:
        description: |-
          ИНН организации (10 или 12 цифр)
          Example: 7707083893
        example: "7707083893"
        type: string
      kpp:
        description: |-
          КПП организации (9 цифр)
          Example: 770701001
        example: "770701001"
        type: string
      legal_address:
        description: |-
          Юридический адрес организации
          Example: г. Москва, ул. Тверская, д. 1
        example: г. Москва, ул. Тверская, д. 1
        type: string
      legal_name:
        description: |-
          Полное юридическое название
          Example: Общество с ограниченной ответственностью "Ромашка"
        example: Общество с ограниченной ответственностью Ромашка
        type: string
      name:
        description: |-
          Название организации (обязательное)
          Example: ООО "Ромашка"
        example: ООО Ромашка
        type: string
      ogrn:
        description: |-
          ОГРН организации (13 цифр)
          Example: 1027700132195
        example: "1027700132195"
        type: string
      share_percent:
        description: |-
          Доля владения (в процентах, от 0 до 100)
          Example: 100.0
        example: 100
        type: number
    required:
    - name
    type: object
  github_com_osi-oss_osi_internal_dto.CreatePositionRequest:
    description: Данные для создания новой должности в организации
    properties:
      department_id:
        description: |-
          ID отдела для привязки (опционально)
          Example: 1
        example: 1
        type: integer
      description:
        description: |-
          Описание должностных обязанностей
          Example: Работа с клиентами, заключение договоров
        example: Работа с клиентами, заключение договоров
        type: string
      is_admin:
        description: |-
          Является ли позиция административной (имеет расширенные права)
          Example: false
        example: false
        type: boolean
      name:
        description: |-
          Название должности (обязательное)
          Example: Менеджер по продажам
        example: Менеджер по продажам
        type: string
    required:
    - name
    type: object
  github_com_osi-oss_osi_internal_dto.DepartmentResponse:
    description: Полная информация об отделе
    properties:
      created_at:
        description: |-
          Дата создания
          Example: 2024-01-15T10:30:00Z
        example: "2024-01-15T10:30:00Z"
        type: string
      description:
        description: |-
          Описание отдела
          Example: Отдел занимается продажами
        example: Отдел занимается продажами
        type: string
      id:
        description: |-
          Уникальный идентификатор отдела
          Example: 1
        example: 1
        type: integer
      location_id:
        description: |-
          ID локации, в которой находится отдел
          Example: 1
        example: 1
        type: integer
      name:
        description: |-
          Название отдела
          Example: Отдел продаж
        example: Отдел продаж
        type: string
      parent_id:
        description: ID родительского отдела (может быть пустым для корневых отделов)
        type: integer
      updated_at:
        description: |-
          Дата последнего обновления
          Example: 2024-01-20T15:45:00Z
        example: "2024-01-20T15:45:00Z"
        type: string
    type: object
  github_com_osi-oss_osi_internal_dto.DepartmentsListResponse:
    description: Список отделов локации
    properties:
