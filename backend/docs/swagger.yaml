host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API для управления организациями, локациями, отделами и позициями
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: OSI API
  version: "1.0"
paths:
  /forgot-password:
    post:
      consumes:
      - application/json
      description: |-
        Отправляет письмо с инструкциями по сбросу пароля на указанный email.
        В целях безопасности всегда возвращает успех, даже если email не найден.
        Токен сброса действителен 1 час.
      parameters:
      - description: Email для восстановления доступа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Инструкции отправлены (если email существует)
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.MessageResponse'
        "400":
          description: Неверный формат email
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      summary: Запрос сброса пароля
      tags:
      - Аутентификация
  /login:
    post:
      consumes:
      - application/json
      description: |-
        Авторизует пользователя по email и паролю.
