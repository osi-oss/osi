        type: string
      organization_id:
        description: |-
          ID организации, которой принадлежит локация
          Example: 1
        example: 1
        type: integer
      source:
        description: |-
          Источник данных
          Example: manual
        enum:
        - manual
        - egrul
        - api
        example: manual
        type: string
      updated_at:
        description: |-
          Дата последнего обновления
          Example: 2024-01-20T15:45:00Z
        example: "2024-01-20T15:45:00Z"
        type: string
