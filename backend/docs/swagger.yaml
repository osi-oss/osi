    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API для управления организациями, локациями, отделами и позициями
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: OSI API
  version: "1.0"
paths:
  /auth/complete-profile:
    post:
      consumes:
      - application/json
      description: |-
        Заполняет обязательные данные профиля после подтверждения email.
        Требуется для новых пользователей перед доступом к системе.
      parameters:
      - description: Данные профиля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.CompleteProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Профиль успешно заполнен
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ProfileResponse'
        "400":
          description: Ошибка валидации или профиль уже заполнен
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Требуется авторизация
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Заполнение профиля
      tags:
      - Аутентификация
  /auth/login-password:
    post:
      consumes:
      - application/json
      description: |-
        Авторизация по email и паролю (если пароль установлен).
        Если пароль не установлен, используйте /auth/request-code.
      parameters:
      - description: Email и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.PasswordLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная авторизация
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.AuthResponse'
        "400":
          description: Пароль не установлен
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Неверный email или пароль
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      summary: Вход по паролю
      tags:
      - Аутентификация
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Завершает сессию пользователя. Удаляет cookie с токеном.
      produces:
      - application/json
      responses:
        "200":
          description: Успешный выход
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.MessageResponse'
      security:
      - BearerAuth: []
      summary: Выход из системы
      tags:
      - Аутентификация
  /auth/request-code:
    post:
      consumes:
      - application/json
      description: |-
        Отправляет 4-символьный код на указанный email.
        Если пользователь не существует, создаётся новый аккаунт.
        Код действителен 20 минут. Максимум 5 запросов в час.
      parameters:
      - description: Email для получения кода
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.RequestCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Код отправлен
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.RequestCodeResponse'
        "400":
          description: Неверный формат email или превышен лимит запросов
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Ошибка отправки email
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      summary: Запрос кода для входа/регистрации
      tags:
      - Аутентификация
  /auth/verify-code:
    post:
      consumes:
      - application/json
      description: |-
        Проверяет код подтверждения и возвращает JWT токен.
        Для новых пользователей требуется заполнение профиля (next_step: complete_profile).
        Максимум 5 попыток ввода кода.
      parameters:
      - description: Email и код подтверждения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.VerifyCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная аутентификация
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.AuthResponse'
        "400":
          description: Неверный или истёкший код
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      summary: Проверка кода и получение токена
      tags:
      - Аутентификация
  /organizations:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает все организации, в которых пользователь является участником или основателем.
        Включает организации со всеми статусами (draft, pending, approved, rejected).
      produces:
      - application/json
      responses:
        "200":
          description: Список организаций пользователя
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.OrganizationsListResponse'
        "401":
          description: Отсутствует или невалидный токен авторизации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список организаций текущего пользователя
      tags:
      - Организации
    post:
      consumes:
      - application/json
      description: |-
        Создаёт новую организацию в системе.
        Текущий пользователь автоматически становится основателем (founder) организации.
        Основатель имеет полные права на управление организацией.
        Новая организация создаётся со статусом "draft".
      parameters:
      - description: Данные для создания организации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.CreateOrganizationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Организация успешно создана
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.OrganizationResponse'
        "400":
          description: 'Ошибка валидации: название обязательно'
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Отсутствует или невалидный токен авторизации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание новой организации
      tags:
      - Организации
  /organizations/{orgId}:
    delete:
      consumes:
      - application/json
      description: |-
        Полностью удаляет организацию из системы.
        Доступно только основателям организации.
        **ВНИМАНИЕ**: Удаление безвозвратно удаляет все связанные данные:
        - Все локации организации
        - Все отделы и позиции
        - Все данные об участниках и сотрудниках
      parameters:
      - description: ID удаляемой организации
        example: 1
        in: path
        minimum: 1
        name: orgId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Организация успешно удалена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.MessageResponse'
        "400":
          description: Неверный формат ID организации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Отсутствует или невалидный токен авторизации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "403":
          description: Только основатель может удалить организацию
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "404":
          description: Организация не найдена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление организации
      tags:
      - Организации
    get:
      consumes:
      - application/json
      description: |-
        Возвращает полную информацию об организации.
        Доступ имеют только участники организации (члены или основатели).
      parameters:
      - description: ID организации
        example: 1
        in: path
        minimum: 1
        name: orgId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные организации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.OrganizationResponse'
        "400":
          description: Неверный формат ID организации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Отсутствует или невалидный токен авторизации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "403":
          description: Нет доступа к организации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "404":
          description: Организация не найдена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение организации по ID
      tags:
      - Организации
    put:
      consumes:
      - application/json
      description: |-
        Обновляет информацию об организации.
        Можно обновлять только те поля, которые переданы в запросе.
        Требует доступа к организации (основатель или участник с соответствующими правами).
      parameters:
      - description: ID организации
        example: 1
        in: path
        minimum: 1
        name: orgId
        required: true
        type: integer
      - description: Новые данные организации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.UpdateOrganizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Организация успешно обновлена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.OrganizationResponse'
        "400":
          description: Ошибка валидации данных
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Отсутствует или невалидный токен авторизации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "403":
          description: Нет прав на редактирование организации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "404":
          description: Организация не найдена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновление данных организации
      tags:
      - Организации
  /organizations/{orgId}/locations:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает все локации организации (активные и неактивные).
        Требуется доступ к организации (участник или основатель).
      parameters:
      - description: ID организации
        example: 1
        in: path
        minimum: 1
        name: orgId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список локаций организации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.LocationsListResponse'
        "400":
          description: Неверный формат ID организации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Отсутствует или невалидный токен авторизации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "403":
          description: Нет доступа к организации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список локаций организации
      tags:
      - Локации
    post:
      consumes:
      - application/json
      description: |-
        Создаёт новую локацию (офис, филиал, склад и т.д.) в организации.
        Требуется право "locations.create" или статус основателя.
        Поле source указывает источник данных: manual (вручную), egrul (из ЕГРЮЛ), api (через API).
      parameters:
      - description: ID организации
        example: 1
        in: path
        minimum: 1
        name: orgId
        required: true
        type: integer
      - description: Данные для создания локации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.CreateLocationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Локация успешно создана
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.LocationResponse'
        "400":
          description: 'Ошибка валидации: name и source обязательны'
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Отсутствует или невалидный токен авторизации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "403":
          description: Нет права locations.create
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "404":
          description: Организация не найдена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание новой локации
      tags:
      - Локации
  /organizations/{orgId}/locations/{locId}:
    delete:
      consumes:
      - application/json
      description: |-
        Удаляет локацию из организации.
        **ВНИМАНИЕ**: Удаление локации удалит все связанные отделы.
        Требуется право "locations.delete" или статус основателя.
      parameters:
      - description: ID организации
        example: 1
        in: path
        minimum: 1
        name: orgId
        required: true
        type: integer
      - description: ID локации
        example: 1
        in: path
        minimum: 1
        name: locId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Локация успешно удалена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.MessageResponse'
        "400":
          description: Неверный формат ID
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Отсутствует или невалидный токен авторизации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "403":
          description: Нет права locations.delete
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "404":
          description: Локация не найдена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление локации
      tags:
      - Локации
    get:
      consumes:
      - application/json
      description: |-
        Возвращает полную информацию о локации.
        Требуется доступ к организации.
      parameters:
      - description: ID организации
        example: 1
        in: path
        minimum: 1
        name: orgId
        required: true
        type: integer
      - description: ID локации
        example: 1
        in: path
        minimum: 1
        name: locId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные локации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.LocationResponse'
        "400":
          description: Неверный формат ID
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Отсутствует или невалидный токен авторизации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "404":
          description: Локация не найдена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение локации по ID
      tags:
      - Локации
    put:
      consumes:
      - application/json
      description: |-
        Обновляет данные локации.
        Можно обновить название, адрес, источник, статус верификации и активность.
        Требуется право "locations.update" или статус основателя.
      parameters:
      - description: ID организации
        example: 1
        in: path
        minimum: 1
        name: orgId
        required: true
        type: integer
      - description: ID локации
        example: 1
        in: path
        minimum: 1
        name: locId
        required: true
        type: integer
      - description: Новые данные локации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.UpdateLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Локация успешно обновлена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.LocationResponse'
        "400":
          description: Ошибка валидации данных
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "401":
          description: Отсутствует или невалидный токен авторизации
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "403":
          description: Нет права locations.update
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "404":
          description: Локация не найдена
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/github_com_osi-oss_osi_internal_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновление локации
      tags:
      - Локации
  /organizations/{orgId}/locations/{locId}/departments:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает все отделы указанной локации.
        Включает как корневые, так и вложенные отделы.
        Требуется доступ к организации.
      parameters:
      - description: ID организации
        example: 1
        in: path
        minimum: 1
        name: orgId
