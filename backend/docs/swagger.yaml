        example: Иван
        minLength: 2
        type: string
      last_name:
        description: |-
          Фамилия (минимум 2 символа)
          Example: Петров
        example: Петров
        minLength: 2
        type: string
      middle_name:
        description: |-
          Отчество (опционально)
          Example: Сергеевич
        example: Сергеевич
        type: string
